spring:
  application:
    name: ms-omni-ingest
  datasource:
    url: jdbc:h2:mem:gjira;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_SCHEMA=gjira
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers:  # unset = no Kafka; set to enable
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: 8080

gjira:
  ingest:
    publish:
      kafka-enabled: false
  storage:
    type: local
    base-path: ./data/gjira
    
gjira:
  sharepoint:
    enabled: true
    tenant-id: ${SP_TENANT_ID}
    client-id: ${SP_CLIENT_ID}
    client-secret: ${SP_CLIENT_SECRET}
  storage:
    type: r2 # Set to r2 for production-grade zero egress

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
