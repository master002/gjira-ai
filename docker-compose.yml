services:
  ms-omni-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_NAME: gjira
      DB_USER: gjira
      DB_PASSWORD: gjira
    volumes:
      - gjira-data:/data/gjira
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gjira
      POSTGRES_USER: gjira
      POSTGRES_PASSWORD: gjira
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gjira -d gjira"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gjira-data:
  postgres-data:
